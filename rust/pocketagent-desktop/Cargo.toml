[package]
name = "pocketagent-desktop"
version = "0.1.15"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rcgen = "0.13"
pocketagent-crypto = { path = "../pocketagent-crypto" }
pocketagent-host = { path = "../pocketagent-host" }
pocketagent-protocol = { path = "../pocketagent-protocol" }
pocketagent-relay = { path = "../pocketagent-relay" }
serde_json = "1"
pulldown-cmark = "0.13"
rustls = { version = "0.23", features = ["ring"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
slint = { version = "1.14", features = ["software-renderer-systemfonts"] }
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "rt", "time"] }
tower = "0.5"
uuid = "1"

[build-dependencies]
slint-build = "1.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
