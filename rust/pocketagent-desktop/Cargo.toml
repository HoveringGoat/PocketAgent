[package]
name = "pocketagent-desktop"
version = "0.1.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
pocketagent-crypto = { path = "../pocketagent-crypto" }
pocketagent-host = { path = "../pocketagent-host" }
pocketagent-protocol = { path = "../pocketagent-protocol" }
pocketagent-relay = { path = "../pocketagent-relay" }
serde_json = "1"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
slint = "1.14"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "rt", "time"] }
tower = "0.5"
uuid = "1"

[build-dependencies]
slint-build = "1.14"
