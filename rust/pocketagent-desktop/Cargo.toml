[package]
name = "pocketagent-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
pocketagent-host = { path = "../pocketagent-host" }
pocketagent-relay = { path = "../pocketagent-relay" }
serde_json = "1"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
slint = "1.14"
tokio = { version = "1", features = ["io-util", "net", "process", "sync", "rt", "time"] }
uuid = "1"

[build-dependencies]
slint-build = "1.14"
