[package]
name = "pocketagent-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
base64 = "0.22"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
