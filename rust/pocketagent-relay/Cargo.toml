[package]
name = "pocketagent-relay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
futures-util = "0.3"
pocketagent-crypto = { path = "../pocketagent-crypto" }
pocketagent-protocol = { path = "../pocketagent-protocol" }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["net", "sync", "rt", "macros"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rcgen = "0.13"
