plugins { id 'com.android.application' }

android {
    namespace 'dev.pocketagent'
    compileSdk 34
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'dev.pocketagent'
        minSdk 26
        targetSdk 34
  versionCode 20
  versionName '0.2.0'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { warningsAsErrors true; disable 'OldTargetApi', 'GradleDependency', 'AndroidGradlePluginVersion' }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'com.google.zxing:core:3.5.4' }
